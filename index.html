<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Gran Día | Invitaciones Digitales</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* DISEÑO DIRECTO PARA QUE NO FALLE */
        :root {
            --primario: #5d4037;
            --dorado: #d4af37;
            --fondo: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--fondo) !important; 
            color: var(--primario); 
            overflow-x: hidden; 
        }

        .header { text-align: center; padding: 25px; background: white; }
        .logo { max-width: 250px; height: auto; }

        .hero { 
            display: flex; flex-direction: column; align-items: center; 
            padding: 50px 20px; text-align: center; max-width: 1200px; margin: 0 auto; 
        }

        .hero-content h1 { 
            font-family: 'Playfair Display', serif; font-size: 3.5rem; 
            margin-bottom: 20px; line-height: 1.1; 
        }

        .btn-wow { 
            display: inline-block; padding: 15px 40px; background: var(--dorado); 
            color: white; text-decoration: none; border-radius: 50px; 
            font-weight: 600; box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3); 
        }

        .phone-display-container { display: flex; gap: 20px; margin-top: 50px; justify-content: center; }
        .phone-card { width: 280px; }
        .phone-card img { width: 100%; height: auto; border-radius: 30px; filter: drop-shadow(0 15px 30px rgba(0,0,0,0.1)); }

        .modelos { padding: 60px 20px; text-align: center; background: white; }
        .grid-modelos { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); 
            gap: 25px; max-width: 1100px; margin: 40px auto; 
        }
        .tarjeta { 
            background: white; border-radius: 15px; padding-bottom: 20px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); overflow: hidden; 
        }
        .tarjeta img { width: 100%; height: 200px; object-fit: cover; }
        .btn-ejemplo { 
            display: inline-block; padding: 8px 25px; color: var(--dorado); 
            text-decoration: none; border: 2px solid var(--dorado); border-radius: 20px; 
        }

        .btn-whatsapp { position: fixed; bottom: 20px; right: 20px; width: 60px; }

        @media (min-width: 1024px) {
            .hero { flex-direction: row; text-align: left; }
            .hero-content { flex: 1.2; padding-right: 40px; }
            .phone-display-container { flex: 1; }
        }
    </style>
</head>
<body>

    <header class="header">
        <img src="1000508411.png" alt="Mi Gran Día" class="logo">
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>La primera impresión de tu Gran Día comienza aquí.</h1>
            <p>Invitaciones digitales e interactivas que enamoran a tus invitados.</p>
            <br>
            <a href="https://wa.me/5219911105456" class="btn-wow">¡Cotizar mi Invitación!</a>
        </div>
        
        <div class="phone-display-container">
            <div class="phone-card"><img src="boda-celular.png" alt="Boda"></div>
            <div class="phone-card"><img src="xv-celular.png" alt="XV Años"></div>
        </div>
    </section>

    <section class="modelos">
        <h2 style="font-family: 'Playfair Display', serif; font-size: 2.5rem; margin-bottom: 30px;">Ver Todos los Modelos</h2>
        <div class="grid-modelos">
            <div class="tarjeta">
                <img src="boda-portada.jpg" alt="Bodas">
                <h3 style="margin: 15px 0;">Bodas</h3>
                <a href="Bodas/index.html" class="btn-ejemplo">Ver Ejemplo</a>
            </div>
            <div class="tarjeta">
                <img src="xv-portada.jpg" alt="XV Años">
                <h3 style="margin: 15px 0;">XV Años</h3>
                <a href="XV-Anos/index.html" class="btn-ejemplo">Ver Ejemplo</a>
            </div>
            <div class="tarjeta">
                <img src="bautizo-portada.jpg" alt="Bautizos">
                <h3 style="margin: 15px 0;">Bautizos</h3>
                <a href="Bautizos/index.html" class="btn-ejemplo">Ver Ejemplo</a>
            </div>
            <div class="tarjeta">
                <img src="baby-portada.jpg" alt="Baby Showers">
                <h3 style="margin: 15px 0;">Baby Showers</h3>
                <a href="Baby-Showers/index.html" class="btn-ejemplo">Ver Ejemplo</a>
            </div>
        </div>
    </section>

    <a href="https://wa.me/5219911105456" class="btn-whatsapp" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
    </a>

</body>
</html>
